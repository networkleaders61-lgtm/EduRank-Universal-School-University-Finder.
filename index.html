<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduRank - Free Open School & University Finder</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        edurank: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            cardHover: '#334155',
                            border: '#334155',
                            accent: '#3b82f6',
                            textMuted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet.js (Free OpenStreetMap Engine) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase Web SDK (v9 Compat - Works out of the box in single HTML files) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #leafletMap {
            height: 100%;
            width: 100%;
            border-radius: 1rem;
            z-index: 10;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    </style>
</head>
<body class="bg-edurank-bg text-gray-100 font-sans h-[100dvh] w-screen flex flex-col overflow-hidden">

    <!-- NAVBAR HEADER -->
    <header class="h-16 border-b border-edurank-border bg-slate-900/80 backdrop-blur-md px-4 md:px-6 flex items-center justify-between flex-shrink-0 z-30">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-extrabold text-lg shadow-lg">E</div>
            <div>
                <h1 class="text-base md:text-lg font-bold text-white tracking-wide leading-tight">EduRank</h1>
                <p class="text-[10px] text-emerald-400 font-medium">Free Live Database & Map Platform</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="openAddModalBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition flex items-center gap-1.5 shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Submit Fee / Info</span>
            </button>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden p-3 md:p-5 gap-4 max-w-[1600px] w-full mx-auto">
        
        <!-- LEFT PANEL: FILTERS & SCHOOL CARDS -->
        <section class="lg:col-span-7 flex flex-col h-full overflow-hidden space-y-3">
            
            <!-- SEARCH AND FILTER CONTROLS -->
            <div class="bg-edurank-card border border-edurank-border p-3.5 md:p-4 rounded-2xl space-y-3 flex-shrink-0 shadow-sm">
                <!-- Search Box -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search school name, city, or curriculum..." class="w-full pl-9 pr-3.5 py-2 bg-slate-900/90 border border-edurank-border rounded-xl text-xs md:text-sm outline-none text-white focus:border-blue-500 transition placeholder-gray-500">
                </div>

                <!-- Sliders Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <!-- Fee Slider -->
                    <div class="space-y-1 bg-slate-900/40 p-2.5 rounded-xl border border-edurank-border/50">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-gray-400 font-medium"><i class="fa-solid fa-sack-dollar text-blue-400 mr-1"></i>Max Annual Tuition:</span>
                            <span id="feeDisplay" class="text-blue-400 font-bold">$10,000</span>
                        </div>
                        <input type="range" id="feeSlider" min="500" max="10000" step="250" value="10000" class="w-full accent-blue-500 cursor-pointer">
                    </div>

                    <!-- Class Size Slider -->
                    <div class="space-y-1 bg-slate-900/40 p-2.5 rounded-xl border border-edurank-border/50">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-gray-400 font-medium"><i class="fa-solid fa-users text-emerald-400 mr-1"></i>Max Class Size:</span>
                            <span id="classDisplay" class="text-emerald-400 font-bold">50 Students</span>
                        </div>
                        <input type="range" id="classSlider" min="10" max="50" step="1" value="50" class="w-full accent-emerald-500 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- DYNAMIC SCHOOL CARDS LIST CONTAINER -->
            <div id="schoolList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Dynamically populated from Firestore or Local Cache -->
            </div>
        </section>

        <!-- RIGHT PANEL: INTERACTIVE LEAFLET MAP -->
        <section class="lg:col-span-5 h-[300px] lg:h-full flex flex-col bg-edurank-card border border-edurank-border rounded-2xl p-3 flex-shrink-0 relative">
            <div class="flex justify-between items-center mb-2 px-1 flex-shrink-0">
                <span class="text-xs font-semibold text-gray-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-map-location-dot text-red-400"></i> OpenStreetMap View
                </span>
                <span id="schoolCountBadge" class="text-[10px] bg-blue-500/20 text-blue-300 px-2.5 py-0.5 rounded-full font-medium border border-blue-500/30">
                    0 Institutions
                </span>
            </div>
            <div class="flex-1 w-full rounded-xl overflow-hidden relative">
                <div id="leafletMap"></div>
            </div>
        </section>
    </main>

    <!-- COMMUNITY CONTRIBUTION MODAL (Save live records to Firestore) -->
    <div id="addModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-edurank-card border border-edurank-border p-5 md:p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-edurank-border pb-3">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-school text-blue-400"></i> Submit Institution Data
                </h3>
                <button id="closeAddModalBtn" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs md:text-sm">
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Institution Name *</label>
                    <input type="text" id="formName" placeholder="e.g. Apex International Academy" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">City / Region *</label>
                        <input type="text" id="formCity" placeholder="Kathmandu" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Curriculum</label>
                        <input type="text" id="formCurriculum" placeholder="A-Levels / National" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Annual Fee ($) *</label>
                        <input type="number" id="formFee" placeholder="2500" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Avg Class Size</label>
                        <input type="number" id="formClass" placeholder="25" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Latitude (GPS)</label>
                        <input type="number" step="any" id="formLat" placeholder="27.7172" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Longitude (GPS)</label>
                        <input type="number" step="any" id="formLng" placeholder="85.3240" class="w-full bg-slate-900 border border-edurank-border rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-edurank-border">
                <button id="cancelModalBtn" class="bg-slate-700 hover:bg-slate-600 text-gray-200 px-4 py-2 rounded-xl text-xs font-semibold transition">Cancel</button>
                <button id="submitSchoolBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-500/20">Save Institution</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION JAVASCRIPT -->
    <script>
        // ----------------------------------------------------
        // 1. FREE FIREBASE CONFIGURATION (Replace values when ready)
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        let db = null;
        let isFirebaseActive = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                isFirebaseActive = true;
            }
        } catch (err) {
            console.warn("Firebase not configured yet. Running in offline fallback mode.", err);
        }

        // ----------------------------------------------------
        // 2. INITIAL SEED / FALLBACK DATA (100% Free Local Dataset)
        // ----------------------------------------------------
        let schools = [
            { id: "1", name: "Kathmandu International School", city: "Kathmandu", curriculum: "IB Diploma / A-Levels", fee: 3200, classSize: 22, rating: 4.8, lat: 27.7172, lng: 85.3240 },
            { id: "2", name: "Apex Model College", city: "Lalitpur", curriculum: "National Board", fee: 1400, classSize: 32, rating: 4.5, lat: 27.6710, lng: 85.3120 },
            { id: "3", name: "Himalayan Science Academy", city: "Bhaktapur", curriculum: "A-Levels", fee: 2100, classSize: 25, rating: 4.6, lat: 27.6710, lng: 85.4298 },
            { id: "4", name: "Valley Public School", city: "Kathmandu", curriculum: "National Board", fee: 950, classSize: 38, rating: 4.2, lat: 27.7300, lng: 85.3400 }
        ];

        let leafletMap = null;
        let mapMarkers = [];

        // ----------------------------------------------------
        // 3. INITIALIZATION & LIFECYCLE
        // ----------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            initLeafletMap();
            setupEventListeners();

            if (isFirebaseActive && db) {
                listenToFirestore();
            } else {
                renderUI();
            }
        });

        // Initialize Free Leaflet Map
        function initLeafletMap() {
            leafletMap = L.map('leafletMap').setView([27.7172, 85.3240], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(leafletMap);
        }

        // Real-time Firestore Sync (Free Tier)
        function listenToFirestore() {
            db.collection("schools").onSnapshot((snapshot) => {
                const liveList = [];
                snapshot.forEach((doc) => {
                    liveList.push({ id: doc.id, ...doc.data() });
                });
                if (liveList.length > 0) schools = liveList;
                renderUI();
            }, (error) => {
                console.error("Firestore Error:", error);
                renderUI();
            });
        }

        // ----------------------------------------------------
        // 4. RENDER UI & MAP PINS
        // ----------------------------------------------------
        function renderUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const maxFee = parseInt(document.getElementById('feeSlider').value, 10);
            const maxClass = parseInt(document.getElementById('classSlider').value, 10);

            const filtered = schools.filter(s => {
                const matchesText = (s.name || '').toLowerCase().includes(query) || 
                                    (s.city || '').toLowerCase().includes(query) || 
                                    (s.curriculum || '').toLowerCase().includes(query);
                const matchesFee = (s.fee || 0) <= maxFee;
                const matchesClass = (s.classSize || 0) <= maxClass;
                return matchesText && matchesFee && matchesClass;
            });

            const listContainer = document.getElementById('schoolList');
            listContainer.innerHTML = '';

            document.getElementById('schoolCountBadge').innerText = `${filtered.length} Institutions`;

            // Clear map pins
            mapMarkers.forEach(m => leafletMap.removeLayer(m));
            mapMarkers = [];

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-edurank-card border border-edurank-border p-8 rounded-2xl text-center space-y-2">
                        <i class="fa-solid fa-building-circle-exclamation text-3xl text-gray-500"></i>
                        <p class="text-sm text-gray-400">No institutions match your search criteria.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(s => {
                // Card UI
                const card = document.createElement('div');
                card.className = "bg-edurank-card border border-edurank-border hover:border-blue-500/50 p-4 rounded-2xl transition duration-200 space-y-3 shadow-sm hover:shadow-md";
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <h3 class="font-bold text-white text-base md:text-lg leading-snug">${escapeHtml(s.name)}</h3>
                            <span class="text-xs text-gray-400 flex items-center gap-1.5 mt-0.5">
                                <i class="fa-solid fa-location-dot text-red-400"></i> ${escapeHtml(s.city || 'Unknown')}
                                <span class="text-gray-600">•</span>
                                <span class="text-blue-400">${escapeHtml(s.curriculum || 'General')}</span>
                            </span>
                        </div>
                        <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap">
                            $${(s.fee || 0).toLocaleString()} / yr
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-edurank-border/60 text-xs text-gray-300">
                        <div class="flex items-center gap-2 bg-slate-900/40 p-2 rounded-xl">
                            <i class="fa-solid fa-users text-emerald-400"></i>
                            <span>Avg Class: <strong>${s.classSize || 'N/A'}</strong></span>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-900/40 p-2 rounded-xl">
                            <i class="fa-solid fa-star text-amber-400"></i>
                            <span>Rating: <strong>${s.rating || '4.5'} / 5</strong></span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);

                // Leaflet Map Pin
                if (s.lat && s.lng) {
                    const marker = L.marker([s.lat, s.lng]).addTo(leafletMap);
                    marker.bindPopup(`
                        <div class="p-1 font-sans">
                            <b class="text-sm">${escapeHtml(s.name)}</b><br/>
                            <span class="text-xs text-blue-600 font-bold">$${(s.fee || 0).toLocaleString()} / year</span><br/>
                            <span class="text-xs text-gray-600">${escapeHtml(s.city)}</span>
                        </div>
                    `);
                    mapMarkers.push(marker);
                }
            });
        }

        // ----------------------------------------------------
        // 5. EVENT LISTENERS & MODAL HANDLERS
        // ----------------------------------------------------
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', renderUI);
            
            document.getElementById('feeSlider').addEventListener('input', (e) => {
                document.getElementById('feeDisplay').innerText = `$${parseInt(e.target.value, 10).toLocaleString()}`;
                renderUI();
            });

            document.getElementById('classSlider').addEventListener('input', (e) => {
                document.getElementById('classDisplay').innerText = `${e.target.value} Students`;
                renderUI();
            });

            const addModal = document.getElementById('addModal');
            document.getElementById('openAddModalBtn').addEventListener('click', () => addModal.classList.remove('hidden'));
            document.getElementById('closeAddModalBtn').addEventListener('click', () => addModal.classList.add('hidden'));
            document.getElementById('cancelModalBtn').addEventListener('click', () => addModal.classList.add('hidden'));

            // Submit Form Data
            document.getElementById('submitSchoolBtn').addEventListener('click', async () => {
                const name = document.getElementById('formName').value.trim();
                const city = document.getElementById('formCity').value.trim();
                const curriculum = document.getElementById('formCurriculum').value.trim() || "National Board";
                const fee = parseInt(document.getElementById('formFee').value, 10) || 0;
                const classSize = parseInt(document.getElementById('formClass').value, 10) || 25;
                const lat = parseFloat(document.getElementById('formLat').value) || 27.7172;
                const lng = parseFloat(document.getElementById('formLng').value) || 85.3240;

                if (!name || !city) {
                    alert("Please provide at least an Institution Name and City.");
                    return;
                }

                const newSchoolObj = {
                    name,
                    city,
                    curriculum,
                    fee,
                    classSize,
                    rating: 4.5,
                    lat,
                    lng,
                    createdAt: new Date().toISOString()
                };

                if (isFirebaseActive && db) {
                    try {
                        await db.collection("schools").add(newSchoolObj);
                        alert("Saved to global real-time Firebase database!");
                    } catch (err) {
                        alert("Error saving to Firebase: " + err.message);
                    }
                } else {
                    // Local memory push fallback
                    newSchoolObj.id = Date.now().toString();
                    schools.unshift(newSchoolObj);
                    renderUI();
                    alert("Institution added in local preview mode!");
                }

                // Reset Form
                document.getElementById('formName').value = '';
                document.getElementById('formCity').value = '';
                document.getElementById('formCurriculum').value = '';
                document.getElementById('formFee').value = '';
                document.getElementById('formClass').value = '';
                addModal.classList.add('hidden');
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
